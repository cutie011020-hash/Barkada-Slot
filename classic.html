<!DOCTYPE html>
<html>
<head>
  <title>Fortune Fruit</title>
  <link rel="stylesheet" href="classic.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="game-wrapper">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="exit-btn" onclick="back()">✖</div>
    <div class="title">🍒 Fortune Fruit</div>
    <div class="balance">💰 <span id="balance">0</span></div>
  </div>

  <!-- SLOT -->
  <div class="slot-area">
    <div id="reels" class="reels">
      ? ? ?<br>
      ? ? ?<br>
      ? ? ?
    </div>
    <div id="winText" class="win-text"></div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="bet-box">
      <button onclick="changeBet(-1)">−</button>
      BET: <span id="bet">1</span>
      <button onclick="changeBet(1)">+</button>
    </div>
    <button class="spin-btn" onclick="spin()">SPIN</button>
  </div>

</div>

<!-- 🔊 SOUNDS -->
<audio id="spinSound" src="sounds/mixkit-fairy-arcade-sparkle-866.wav"></audio>
<audio id="winSound" src="sounds/mixkit-unlock-game-notification-253.wav"></audio>

<!-- 🔥 FIREBASE SDK (IMPORTANT) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- 🔧 CONFIG -->
<script src="js/firebase.js"></script>

<!-- 🎮 GAME (LAST) -->
<script src="classic.js"></script>

</body>
</html>
