<!DOCTYPE html>
<html>
<head>
  <title>Slot Game</title>
  <link rel="stylesheet" href="classic.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="game-wrapper">

  <!-- TOP BALANCE -->
  <div class="top-bar">
    💰 <span id="balance">1000</span>
  </div>

  <!-- SLOT AREA -->
  <div class="slot-area">

    <div id="reels" class="reels">
      ? ? ?<br>
      ? ? ?<br>
      ? ? ?
    </div>

    <div id="winText" class="win-text"></div>

  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <div class="bet-box">
      <button onclick="changeBet(-1)">−</button>
      BET: <span id="bet">1</span>
      <button onclick="changeBet(1)">+</button>
    </div>

    <button class="spin-btn" onclick="spin()">SPIN</button>
    <button class="back-btn" onclick="back()">BACK</button>

  </div>

</div>

<script src="classic.js"></script>
</body>
</html>
