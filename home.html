<!DOCTYPE html>
<html>
<head>
  <title>Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script src="js/firebase.js"></script>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle, #004d40, black);
      font-family: Arial;
      color: white;
      text-align: center;
    }

    .top {
      padding: 20px;
      background: #00332a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .balance {
      background: black;
      padding: 5px 15px;
      border-radius: 20px;
      border: 2px solid gold;
      color: gold;
    }

    .games {
      margin-top: 30px;
    }

    .card {
      width: 120px;
      height: 120px;
      background: orange;
      margin: 10px auto;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
    }

    button {
      margin-top: 20px;
      padding: 10px;
    }
  </style>
</head>
<body>

<div class="top">
  <div onclick="logout()">❌</div>
  <div>🎰 HOME</div>
  <div class="balance">💰 <span id="balance">0</span></div>
</div>

<div class="games">
  <div class="card" onclick="openGame()">PLAY SLOT</div>
</div>

<button onclick="logout()">Logout</button>

<script src="home.js"></script>

</body>
</html>
